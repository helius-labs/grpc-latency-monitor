# Local ClickHouse and Grafana for trying the benchmark. Not for production: the
# credentials below are fixed, and the schema is applied without Goose (see
# docker/clickhouse-init.sh). Run the subscriber on the host with
# `cargo run -- --config your.local.yaml` against http://localhost:8123.
# If 8123 or 3000 are taken, set CLICKHOUSE_PORT and GRAFANA_PORT.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: benchmark
      CLICKHOUSE_USER: benchmark
      CLICKHOUSE_PASSWORD: benchmark
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./sql/migrations:/migrations:ro
      - ./docker/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "benchmark", "--password", "benchmark", "--query", "SELECT 1"]
      interval: 5s
      retries: 30

  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/solana-streaming-benchmark.json:/var/lib/grafana/dashboards/solana-streaming-benchmark.json:ro
      - ./grafana/solana-streaming-head-to-head.json:/var/lib/grafana/dashboards/solana-streaming-head-to-head.json:ro
      - ./grafana/solana-streaming-overview.json:/var/lib/grafana/dashboards/solana-streaming-overview.json:ro

volumes:
  clickhouse:
  grafana:
